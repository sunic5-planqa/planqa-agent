[project]
name = "planqa-eval"
version = "0.1.0"
description = "Evaluation agent that checks the PlanQA rulebook review agent's output against the human-labeled golden dataset"
readme = "README.md"
authors = [
    { name = "kayo2e", email = "gy3216@naver.com" }
]
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "google-genai>=0.3",
    "planqa-schemas",
]

[project.scripts]
planqa-eval = "planqa_eval.cli:main"

[tool.uv.sources]
planqa-schemas = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
